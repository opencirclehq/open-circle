<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060A" />
    <meta name="color-scheme" content="dark" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("opencircle:theme"); } catch {}
        const dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        const resolved = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="color-scheme"]').content = resolved;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#04060A" : "#F6F7F9";
      })();
    </script>

    <title>OpenCircle · Live GitHub ranking for Open Source Circle</title>
    <meta name="description" content="The live GitHub leaderboard for the Open Source Circle developer community. Paste your username, take your place, and climb as the circle stars your work." />
    <meta name="author" content="Open Source Circle" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/AspektaVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook, Slack, Discord, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenCircle" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="OpenCircle · Live GitHub ranking for Open Source Circle" />
    <meta property="og:description" content="The live GitHub leaderboard for the Open Source Circle developer community. Paste your username, take your place, and climb as the circle stars your work." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenCircle: a white podium with a gold crown over first place, inside an open chrome ring." />

    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="OpenCircle: a white podium with a gold crown over first place, inside an open chrome ring." />

    <script type="application/ld+json">

          },

            "alternateName": "Open Source Circle",
